<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Search</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link rel="stylesheet" href="markdown.css?v=3" />
  <script src="js/shared.js?v=ocr-markdown-2"></script>
  <script>initTheme();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="dark-mode.css" />
  <style>[x-cloak] { display: none !important; }</style>
  <script src="js/ocr-search-app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="ocrSearchApp()">
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-4">
      <h1 class="text-lg font-bold text-indigo-700 shrink-0">OCR Search</h1>
      <form class="flex-1 flex gap-3" @submit.prevent="search()">
        <input type="search" x-model="query" placeholder="Search OCR text only…"
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700">
          Search
        </button>
      </form>
      <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100" title="Toggle dark mode">
        Theme
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8" x-cloak>
    <div x-show="searched && !loading && !error" class="mb-4 flex items-center text-xs text-gray-400">
      <span x-text="total + ' OCR results · ' + elapsedMs + ' ms'"></span>
      <div x-show="totalPages > 1" class="ml-auto flex items-center gap-2">
        <button @click="changePage(page - 1)" :disabled="page <= 1"
          class="px-3 py-1 rounded-lg border text-sm disabled:opacity-40 hover:bg-gray-50">← Prev</button>
        <span x-text="'Page ' + page + ' / ' + totalPages"></span>
        <button @click="changePage(page + 1)" :disabled="page >= totalPages"
          class="px-3 py-1 rounded-lg border text-sm disabled:opacity-40 hover:bg-gray-50">Next →</button>
      </div>
    </div>

    <div x-show="loading" class="text-center py-16 text-gray-500">Searching OCR text…</div>

    <div x-show="error" class="bg-red-50 border border-red-200 rounded-xl p-5 text-red-600" x-text="error"></div>

    <div x-show="searched && !loading && !error && results.length === 0" class="text-center py-16 text-gray-400">
      No OCR matches found.
    </div>

    <div x-show="!loading" class="grid gap-4">
      <template x-for="publication in results" :key="publication.id">
        <article class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <div class="flex justify-between gap-4">
            <div>
              <h2 class="font-semibold text-gray-800" x-text="publication.title"></h2>
              <p class="text-sm text-indigo-600 mt-0.5" x-text="publication.authors.join(', ')"></p>
            </div>
            <span class="text-xs text-gray-400" x-text="publication.year || ''"></span>
          </div>
          <div class="pdf-excerpt mt-3">
            <span class="inline-block text-[10px] font-semibold uppercase tracking-wide text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">Text from PDF's OCR</span>
            <div class="ocr-markdown mt-1 text-sm text-gray-700 leading-relaxed"
              x-html="renderOcrMarkdown(publication.ocrSnippet)"></div>
          </div>
          <div class="mt-4 flex gap-3 text-sm">
            <a :href="'/publication.html?id=' + publication.id" class="text-indigo-600 hover:underline">View</a>
            <a x-show="publication.pdfFileName" :href="'/api/publications/' + publication.id + '/download'"
              class="text-indigo-600 hover:underline">Download PDF</a>
          </div>
        </article>
      </template>
    </div>
  </main>
</body>
</html>
