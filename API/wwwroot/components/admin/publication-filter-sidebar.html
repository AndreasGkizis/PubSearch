<aside class="w-1/4 shrink-0 overflow-y-auto scrollbar-hide">
  <div class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col gap-6">
    <div class="flex items-center justify-between">
      <span class="text-sm font-semibold text-gray-700">Filters</span>
      <button x-show="activeFilterCount > 0" @click="clearFilters()"
        class="text-xs text-gray-400 hover:text-red-500 underline">Clear All</button>
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Year Range</span>
      <div class="flex items-center gap-2">
        <input type="number" x-model="filterYearFrom"
          @input.debounce.400ms="applyFilters()"
          placeholder="From"
          class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <span class="text-gray-400">–</span>
        <input type="number" x-model="filterYearTo"
          @input.debounce.400ms="applyFilters()"
          placeholder="To"
          class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
        Keywords
        <span x-show="filterSelectedKeywords.length > 0" class="normal-case font-normal text-indigo-600"
          x-text="'(' + filterSelectedKeywords.length + ')'"></span>
      </span>
      <input type="text" x-model="keywordFilterSearch" placeholder="Search keywords ..."
        class="border border-gray-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <div class="overflow-y-auto max-h-44 flex flex-col gap-0.5 pr-1">
        <template x-for="kw in filteredFilterKeywords" :key="kw.name">
          <label class="flex items-center gap-2 text-sm cursor-pointer hover:bg-indigo-50 rounded px-1 py-0.5">
            <input type="checkbox" :value="kw.name" x-model="filterSelectedKeywords"
              @change="applyFilters()" class="accent-indigo-600 shrink-0" />
            <span x-text="kw.name" class="truncate"></span>
            <span class="text-xs text-gray-400 ml-auto shrink-0" x-text="'(' + kw.count + ')'"></span>
          </label>
        </template>
        <p x-show="filteredFilterKeywords.length === 0" class="text-xs text-gray-400 px-1 py-1">No keywords found.</p>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
        Authors
        <span x-show="filterSelectedAuthors.length > 0" class="normal-case font-normal text-indigo-600"
          x-text="'(' + filterSelectedAuthors.length + ')'"></span>
      </span>
      <input type="text" x-model="authorFilterSearch" placeholder="Search authors ..."
        class="border border-gray-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <div class="overflow-y-auto max-h-44 flex flex-col gap-0.5 pr-1">
        <template x-for="author in filteredFilterAuthors" :key="author.name">
          <label class="flex items-center gap-2 text-sm cursor-pointer hover:bg-indigo-50 rounded px-1 py-0.5">
            <input type="checkbox" :value="author.name" x-model="filterSelectedAuthors"
              @change="applyFilters()" class="accent-indigo-600 shrink-0" />
            <span x-text="author.name" class="truncate"></span>
            <span class="text-xs text-gray-400 ml-auto shrink-0" x-text="'(' + author.count + ')'"></span>
          </label>
        </template>
        <p x-show="filteredFilterAuthors.length === 0" class="text-xs text-gray-400 px-1 py-1">No authors found.</p>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
        Languages
        <span x-show="filterSelectedLanguages.length > 0" class="normal-case font-normal text-indigo-600"
          x-text="'(' + filterSelectedLanguages.length + ')'"></span>
      </span>
      <input type="text" x-model="languageFilterSearch" placeholder="Search languages ..."
        class="border border-gray-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <div class="overflow-y-auto max-h-44 flex flex-col gap-0.5 pr-1">
        <template x-for="lang in filteredFilterLanguages" :key="lang.name">
          <label class="flex items-center gap-2 text-sm cursor-pointer hover:bg-indigo-50 rounded px-1 py-0.5">
            <input type="checkbox" :value="lang.name" x-model="filterSelectedLanguages"
              @change="applyFilters()" class="accent-indigo-600 shrink-0" />
            <span x-text="lang.name" class="truncate"></span>
            <span class="text-xs text-gray-400 ml-auto shrink-0" x-text="'(' + lang.count + ')'"></span>
          </label>
        </template>
        <p x-show="filteredFilterLanguages.length === 0" class="text-xs text-gray-400 px-1 py-1">No languages found.</p>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
        Publication Types
        <span x-show="filterSelectedPublicationTypes.length > 0" class="normal-case font-normal text-indigo-600"
          x-text="'(' + filterSelectedPublicationTypes.length + ')'"></span>
      </span>
      <input type="text" x-model="publicationTypeFilterSearch" placeholder="Search types ..."
        class="border border-gray-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <div class="overflow-y-auto max-h-44 flex flex-col gap-0.5 pr-1">
        <template x-for="pt in filteredFilterPublicationTypes" :key="pt.name">
          <label class="flex items-center gap-2 text-sm cursor-pointer hover:bg-indigo-50 rounded px-1 py-0.5">
            <input type="checkbox" :value="pt.name" x-model="filterSelectedPublicationTypes"
              @change="applyFilters()" class="accent-indigo-600 shrink-0" />
            <span x-text="pt.name" class="truncate"></span>
            <span class="text-xs text-gray-400 ml-auto shrink-0" x-text="'(' + pt.count + ')'"></span>
          </label>
        </template>
        <p x-show="filteredFilterPublicationTypes.length === 0" class="text-xs text-gray-400 px-1 py-1">No types found.</p>
      </div>
    </div>
  </div>
</aside>
