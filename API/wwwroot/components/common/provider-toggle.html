<div class="flex items-center bg-gray-100 border border-gray-200 rounded-xl p-0.5 text-xs font-medium shrink-0">
  <button
    @click="searchProvider = 'typesense'; localStorage.setItem('searchProvider','typesense'); refreshSearchProvider()"
    :class="searchProvider === 'typesense' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-200'"
    class="px-3 py-1.5 rounded-lg transition-colors"
  >
    Typesense
  </button>
  <button
    @click="searchProvider = 'mssql'; localStorage.setItem('searchProvider','mssql'); refreshSearchProvider()"
    :class="searchProvider === 'mssql' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-200'"
    class="px-3 py-1.5 rounded-lg transition-colors"
  >
    SQL
  </button>
</div>
