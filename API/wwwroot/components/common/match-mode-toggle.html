<div class="flex items-center bg-gray-100 border border-gray-200 rounded-xl p-0.5 text-xs font-medium shrink-0">
  <button
    @click="fuzzyFilters = false; localStorage.setItem('fuzzyFilters', 'false')"
    :class="!fuzzyFilters ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-200'"
    class="px-3 py-1.5 rounded-lg transition-colors"
  >
    Exact
  </button>
  <button
    @click="fuzzyFilters = true; localStorage.setItem('fuzzyFilters', 'true')"
    :class="fuzzyFilters ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-200'"
    class="px-3 py-1.5 rounded-lg transition-colors"
  >
    Fuzzy
  </button>
</div>
